name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          brew install bats-core shellcheck starship fzf fzf-tab \
            zsh-autosuggestions zsh-completions zsh-syntax-highlighting
          chmod go-w "$(brew --prefix)/share"

      - name: Test
        run: make test
        env:
          # Hosted runners are slower than a laptop; the local budget is 250 ms.
          ZSH_STARTUP_BUDGET_MS: "600"
