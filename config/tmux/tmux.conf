# Prefix is Ctrl+A.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Colours and terminal features.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g focus-events on

# Vim keys in copy mode, mouse on, no delay after Escape.
setw -g mode-keys vi
set -g mouse on
set -sg escape-time 10

# Windows and panes start at 1 and close gaps when one is removed.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g history-limit 50000

# Ctrl+A r reloads this file.
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"

# Split with | and -, keep the current path.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
